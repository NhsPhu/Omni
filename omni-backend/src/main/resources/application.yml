spring:
  application:
    name: omni-backend

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:omni_db}
    username: ${DB_USER:omni_user}
    password: ${DB_PASSWORD:omni_password}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate # Flyway will handle schema creation
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

  elasticsearch:
    uris: http://${ES_HOST:localhost}:9200
    username: ${ES_USER:elastic}
    password: ${ES_PASSWORD:elastic}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:omni_rabbit}
    password: ${RABBITMQ_PASSWORD:omni_rabbit_pass}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:omnistorenf@gmail.com}
    password: ${MAIL_PASSWORD:dummy}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML

jwt:
  secret: ${JWT_SECRET_KEY:eW91cl9zdXBlcl9zZWNyZXRfa2V5X2F0X2xlYXN0XzMyX2NoYXJzX2xvbmdfY2hhbmdlX21l} # Uses ENV variable (REQUIRED)
  expiration: 86400000 # 1 day in ms
  refresh-expiration: 604800000 # 7 days in ms

server:
  port: 8080

app:
  storefront-url: ${STOREFRONT_URL:http://localhost:3000}
  dashboard-url: ${DASHBOARD_URL:http://localhost:5173}

ghn:
  api:
    url: https://online-gateway.ghn.vn/shiip/public-api/v2
    token: ${GHN_TOKEN:dummy}
    shopId: ${GHN_SHOP_ID:6471542}

cloudinary:
  url: ${CLOUDINARY_URL:}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:UD2YB7G7}
  hash-secret: ${VNPAY_HASH_SECRET:dummy}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 1.0
