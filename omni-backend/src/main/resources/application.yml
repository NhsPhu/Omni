spring:
  application:
    name: omni-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/omni_db
    username: omni_user
    password: omni_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Flyway will handle schema creation
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: smtp.mailtrap.io # Replace with real SMTP later
    port: 2525
    username: test_user
    password: test_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: YmFzZTY0LWVuY29kZWQtc2VjcmV0LWtleS1tdXN0LWJlLWF0LWxlYXN0LTMyeWJ0ZXMtbG9uZw== # Example base64 key
  expiration: 86400000 # 1 day in ms
  refresh-expiration: 604800000 # 7 days in ms

server:
  port: 8080
