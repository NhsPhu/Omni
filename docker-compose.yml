services:
  postgres:
    image: postgres:16-alpine
    container_name: omni_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-omni_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-omni_password}
      POSTGRES_DB: ${DB_NAME:-omni_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni_user -d omni_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - omni_network

  redis:
    image: redis:7-alpine
    container_name: omni_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - omni_network

  minio:
    image: minio/minio
    container_name: omni_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-omni_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-omni_password123}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - omni_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: omni_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - omni_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: omni_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-omni_rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-omni_rabbit_pass}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - omni_network

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: omni_zipkin
    ports:
      - "9411:9411"
    restart: unless-stopped
    networks:
      - omni_network

  n8n:
    image: n8nio/n8n:latest
    container_name: omni_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-omni_n8n_2024}
      - N8N_HOST=omni_n8n
      - WEBHOOK_URL=http://omni_n8n:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - omni_network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: omni_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - omni_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: omni_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - omni_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  es_data:
  rabbitmq_data:
  n8n_data:
  grafana_data:
  prometheus_data:
  minio_data:

networks:
  omni_network:
    driver: bridge
