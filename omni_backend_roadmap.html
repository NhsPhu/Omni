function build(){
  const wrap=document.getElementById('phases')
  phases.forEach((p,pi)=>{
    const ph=document.createElement('div')
    ph.className='phase'
    ph.innerHTML=`
<div class="phase-header" onclick="toggle(${pi})">
  <div class="ph-num" style="background:${p.bg};color:${p.textColor}">${p.num}</div>
  <div class="ph-info">
    <div class="ph-title">${p.title}</div>
    <div class="ph-meta">${p.meta}</div>
  </div>
  <div class="ph-right">
    <span class="dur-badge" style="background:${p.bg};color:${p.textColor}">${p.dur}</span>
    <i class="ti ti-chevron-down chevron" id="chv${pi}" aria-hidden="true"></i>
  </div>
</div>
<div class="phase-body" id="body${pi}">
  <div class="section-tabs">
    <div class="stab on" onclick="stab(${pi},0,this)"><i class="ti ti-list-check" aria-hidden="true"></i> Tasks</div>
    <div class="stab" onclick="stab(${pi},1,this)"><i class="ti ti-database" aria-hidden="true"></i> Database</div>
    <div class="stab" onclick="stab(${pi},2,this)"><i class="ti ti-api" aria-hidden="true"></i> APIs</div>
    <div class="stab" onclick="stab(${pi},3,this)"><i class="ti ti-package" aria-hidden="true"></i> Dependencies</div>
  </div>
  <div class="stab-pane on" id="sp${pi}_0">
    <div class="task-list">${p.tasks.map(t=>`
      <div class="task">
        <div class="task-dot" style="background:${t.dot}"></div>
        <div><div class="task-text">${t.text}</div><div class="task-sub">${t.sub}</div></div>
      </div>`).join('')}
    </div>
  </div>
  <div class="stab-pane" id="sp${pi}_1">
    ${p.db.map(d=>`
    <div class="db-block">
      <div class="db-label">${d.label}</div>
      <div class="db-tables">${d.tables.map(t=>`<span class="db-table new">${t}</span>`).join('')}</div>
    </div>`).join('')}
    <div class="note-box ${p.note.type}">${p.note.text}</div>
  </div>
  <div class="stab-pane" id="sp${pi}_2">
    <div class="api-list">${p.apis.map(a=>`
      <div class="api-row">
        <span class="method m-${a.m.toLowerCase()}">${a.m}</span>
        <span class="api-path">${a.p}</span>
        <span class="api-desc">${a.d}</span>
      </div>`).join('')}
    </div>
  </div>
  <div class="stab-pane" id="sp${pi}_3">
    <div class="dep-grid">${p.deps.map(d=>`
      <div class="dep-card">
        <div class="dep-name">${d.name}</div>
        <div class="dep-desc">${d.desc}</div>
      </div>`).join('')}
    </div>
    <div style="margin-top:10px">
      <button onclick="sendPrompt('Cho tôi xem cấu hình pom.xml đầy đủ cho giai đoạn ${p.num}: ${p.title}')" style="font-size:12px;padding:6px 12px">Xem pom.xml giai đoạn ${p.num} ↗</button>
    </div>
  </div>
</div>`
    wrap.appendChild(ph)
  })
}

function toggle(i){
  const b=document.getElementById('body'+i)
  const c=document.getElementById('chv'+i)
  const open=b.classList.contains('open')
  b.classList.toggle('open',!open)
  c.classList.toggle('open',!open)
}

function stab(pi,ti,el){
  for(let j=0;j<4;j++){
    const p=document.getElementById('sp'+pi+'_'+j)
    if(p)p.classList.toggle('on',j===ti)
  }
  el.closest('.section-tabs').querySelectorAll('.stab').forEach((t,j)=>t.classList.toggle('on',j===ti))
}

build()
document.getElementById('body0').classList.add('open')
document.getElementById('chv0').classList.add('open')
</script>
